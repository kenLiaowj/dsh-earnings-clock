<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- dsh-earnings-clock: a coin with a clock hand inside a progress ring.
       The coin is today's wage filling up, the ring is the workday progress. -->
  <defs>
    <linearGradient id="ec-coin" x1="7" y1="8" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7BE0B0"/>
      <stop offset="1" stop-color="#0E9F6E"/>
    </linearGradient>
    <linearGradient id="ec-ring" x1="4" y1="4" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD36E"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <circle cx="18" cy="18" r="7.2" stroke="url(#ec-coin)" stroke-width="2.1"/>
  <path d="M18 14.4V18l2.5 1.6" stroke="url(#ec-coin)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 5.6A12.4 12.4 0 0 1 30.4 18" stroke="url(#ec-ring)" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M18 30.4A12.4 12.4 0 0 1 5.6 18" stroke="url(#ec-ring)" stroke-width="2.1" stroke-linecap="round" opacity="0.4"/>
</svg>
